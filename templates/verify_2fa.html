{% extends "includes/header.html" %}

{% block title %}Verify 2FA - CryptoBot{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-card">
        <h2><i class="fas fa-shield-alt"></i> Two-Factor Authentication</h2>
        <p class="text-muted">Please enter the 6-digit code we emailed to your account.</p>
        <form method="POST" action="{{ url_for('verify_2fa') }}">
            <div class="form-group">
                <label for="code">Verification Code</label>
                <input type="text" class="form-control" id="code" name="code" required maxlength="6" pattern="[0-9]{6}">
                <small class="form-text">Enter the 6-digit code</small>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Verify</button>
        </form>
    </div>
</div>
{% endblock %}
